name: Agent Admin V1
on:
  issues:
    types: [opened]

permissions:
  issues: write
  projects: write

jobs:
  accueil:
    runs-on: ubuntu-latest
    steps:
      - name: Répondre à la nouvelle tâche
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Bonjour 👋 Merci pour cette tâche!

            ✅ Ajoutée au Project Admin
            🏷️ Milestone: V1 - Base stable

            L'agent va la traiter. Statut: À faire.
            ---
            *Réponse automatique V1 - 0 budget*
