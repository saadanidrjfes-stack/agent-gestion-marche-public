name: Agent Admin V2.3 Debug
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  cerveau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_3 }}
        with:
          script: |
            const titre = context.payload.issue.title;
            const desc = context.payload.issue.body || "";
            const prompt = `Tu es expert marchés publics Maroc décret 2-22-431. Tâche: ${titre} - ${desc}. Réponds en 4 parties courtes FR: 1. COMPREHENSION 2. ARTICLE LOI 3. ACTION TECHNIQUE 4. NEXT STEP`;
            let result = "";
            try {
              const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${process.env.GEMINI_API_KEY_3}`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({contents:[{parts:[{text:prompt}]}]})
              });
              const data = await r.json();
              console.log(JSON.stringify(data));
              if (data.candidates) result = data.candidates[0].content.parts[0].text;
              else result = `❌ ERREUR GOOGLE: ${JSON.stringify(data).substring(0,1000)}\n\nVa sur aistudio.google.com et active l'API Generative Language`;
            } catch(e){ result = `❌ EXCEPTION: ${e.message}`; }
            await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body: `### 🧠 Cerveau V2.3\n${result}` });
