name: Agent Admin V1.1 Stable
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  accueil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Bonjour 👋 Merci pour cette tâche!

              ✅ Ajoutée au Project Admin en Todo
              🏷️ Milestone: V1 - Base stable

              Test réussi, l'agent répond!`
            })
