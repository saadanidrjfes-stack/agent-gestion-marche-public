name: Agent Admin V2.2 Auto-Fix
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  cerveau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const titre = context.payload.issue.title;
            const description = context.payload.issue.body || "";
            const prompt = `Tu es expert marchés publics Maroc décret 2-22-431. Tâche: Titre=${titre} Description=${description}. Réponds en français en 4 parties: 1. COMPREHENSION 2. ARTICLE LOI 3. ACTION TECHNIQUE 4. NEXT STEP. Concis.`;
            const modeles = ["gemini-2.0-flash", "gemini-2.5-flash-lite", "gemini-1.5-flash-8b"];
            let analyseIA = "";
            for (const m of modeles) {
              try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${process.env.GEMINI_API_KEY}`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({contents:[{parts:[{text:prompt}]}]}) });
                const d = await r.json();
                if (d.candidates) { analyseIA = d.candidates[0].content.parts[0].text; break; }
              } catch(e){}
            }
            if (!analyseIA) analyseIA = "IA indisponible, vérifie GEMINI_API_KEY dans Secrets.";
            await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body: `Bonjour 👋\n\n✅ Project Admin Todo\n\n### 🧠 Analyse Cerveau Gratuit (Gemini)\n${analyseIA}\n\n---\n*V2.2 Auto-Fix - Prêt pour base PDF*` });
